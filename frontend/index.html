<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gitea Markdown Search RAG & MCP" />
  <title>Gitea Markdown Search</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gitea-search:theme');
        if (stored === 'auto' || stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
